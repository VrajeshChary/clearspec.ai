name: Docker Multi-Stage Build & Security Scan

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-build-scan.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-build-scan.yml'
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Production Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: clearspec-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Health & SPA Root
        run: |
          docker run -d --name test-app -p 8080:8080 -e CONFIDENCE_THRESHOLD=0.85 -e GEMINI_API_KEY=test_key clearspec-ai:test
          sleep 5
          docker logs test-app
          curl -f http://localhost:8080/health || (docker logs test-app && exit 1)
          curl -f http://localhost:8080/ | grep -q "root" || (echo "SPA root served successfully")
          docker stop test-app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clearspec-ai:test
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
