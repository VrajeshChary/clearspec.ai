name: Release & Distribution Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Distribution
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Package Distribution Zip
        run: |
          mkdir -p release-dist
          zip -r release-dist/clearspec-ai-bundle.zip backend/ frontend/dist/ Dockerfile .dockerignore README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-dist/clearspec-ai-bundle.zip
          generate_release_notes: true
          draft: false
          prerelease: false
